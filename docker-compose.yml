services:
  db:
    image: postgres:16-alpine
    container_name: elearning_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-elearning_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elearning_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-elearning}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-elearning_user} -d ${POSTGRES_DB:-elearning}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elearning_web
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-elearning_user}:${POSTGRES_PASSWORD:-elearning_secure_pass_2026}@db:5432/${POSTGRES_DB:-elearning}?schema=public
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-super-random-jwt-key-32chars-must-change}
      APP_NAME: ${APP_NAME:-World Trading Lab}
    env_file:
      - .env.production.local

volumes:
  postgres_data:
    driver: local
