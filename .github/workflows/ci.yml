name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Code Quality & Automated Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:password@localhost:5432/testdb?schema=public"
      DIRECT_URL: "postgresql://postgres:password@localhost:5432/testdb?schema=public"
      NEXTAUTH_SECRET: "ci-secret-key-for-testing-only-1234567890"
      NEXTAUTH_URL: "http://localhost:3000"
      APP_NAME: "World Trading Lab"
      BANK_ID: "MB"
      BANK_ACCOUNT_NO: "0988888888"
      BANK_ACCOUNT_NAME: "WORLD TRADING LAB"
      CRON_SECRET: "ci-cron-secret-32chars-key-1234567890"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Setup CI Database Schema & Seed
        run: |
          npx prisma db push --skip-generate
          npm run db:seed

      - name: Type Check (TypeScript)
        run: npm run type-check

      - name: Lint Code (ESLint)
        run: npm run lint

      - name: Run Unit Tests (Vitest)
        run: npm test

      - name: Build Next.js Application
        run: npm run build
